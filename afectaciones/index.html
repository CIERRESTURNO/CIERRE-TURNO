<style>
:root{
  --naranja:#FB5314; --naranja-osc:#D8430C; --naranja-suave:#FFF0E8; --naranja-borde:#FFD2BD;
  --gris-pv:#A7A6A7; --tinta:#2E2E2E; --gris:#6E6E6E; --gris2:#A7A6A7; --linea:#E8E6E4; --fondo:#F5F4F3; --blanco:#fff;
  --verde:#1D8A4E; --verde-s:#E6F6EC; --rojo:#C8311B; --rojo-s:#FDE9E5; --ambar:#B26A00; --ambar-s:#FFF4E0; --azul:#2B5FB3; --azul-s:#E9F0FB;
  --r:14px; --sombra:0 1px 2px rgba(20,20,20,.05),0 6px 18px rgba(20,20,20,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--naranja)}
header{background:#fff;border-bottom:3px solid var(--naranja);padding:10px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
header img{height:34px;width:auto;display:block}
header .t{line-height:1.15}
header .t b{font-size:15px;font-weight:700;display:block}
header .t small{color:var(--gris);font-size:12px}
header .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--fondo);border:1px solid var(--linea);border-radius:999px;padding:5px 11px 5px 6px;font-size:13px;font-weight:500}
.chip i{width:24px;height:24px;border-radius:50%;background:var(--naranja);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
nav.tabs{display:flex;gap:2px;padding:0 12px;background:#fff;border-bottom:1px solid var(--linea);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:12px 13px;cursor:pointer;color:var(--gris);font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--tinta);border-bottom-color:var(--naranja)}
main{padding:18px 16px 110px;max-width:1240px;margin:0 auto}
h2.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:22px 0 10px;font-weight:700}
.btn{border:1.5px solid var(--linea);background:#fff;border-radius:11px;padding:10px 15px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:14px}
.btn:hover{background:#F3F2F1}
.btn.pri{background:var(--naranja);border-color:var(--naranja);color:#fff}
.btn.pri:hover{background:var(--naranja-osc)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--gris)}
.btn.danger{color:var(--rojo);border-color:#F3C7BF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gris-pv)}
.kpi.o:before{background:var(--naranja)}
.kpi.r:before{background:var(--rojo)}
.kpi.g:before{background:var(--verde)}
.kpi .n{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.kpi .n small{font-size:13px;font-weight:600;color:var(--gris);margin-left:3px}
.kpi .l{color:var(--gris);font-size:12.5px;margin-top:4px}
.card{background:#fff;border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra)}
.pad{padding:16px}
.toolbar{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
select.f,input.f{padding:9px 11px;border:1px solid var(--linea);border-radius:10px;background:#fff;font-size:14px;max-width:100%}
input.f[type=month]{min-width:150px}
.alert{background:var(--rojo-s);border:1px solid #F3C7BF;color:#7A2112;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.alert b{display:block}
.alert .sp{flex:1}
.alert.ok{background:var(--verde-s);border-color:#BFE5CC;color:#0F5A30}
.grid-s{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.surt{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:12px 13px;cursor:pointer;transition:.15s}
.surt:hover{border-color:var(--naranja-borde);box-shadow:var(--sombra)}
.surt .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.surt .h b{font-size:17px;font-weight:800}
.surt .caras{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.surt .cara{flex:1;min-width:40px;height:30px;border-radius:7px;background:var(--fondo);border:1px solid var(--linea);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--gris)}
.surt .cara.af{background:var(--rojo-s);border-color:#F3C7BF;color:var(--rojo)}
.surt .cara.mt{background:var(--naranja-suave);border-color:var(--naranja-borde);color:var(--naranja-osc)}
.surt .cara.af.mt{background:linear-gradient(135deg,var(--rojo-s) 50%,var(--naranja-suave) 50%)}
.surt .m{font-size:12px;color:var(--gris);display:flex;gap:10px;flex-wrap:wrap}
.surt .m b{color:var(--tinta)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-r{background:var(--rojo-s);color:var(--rojo)}
.t-g{background:var(--verde-s);color:var(--verde)}
.t-o{background:var(--naranja-suave);color:var(--naranja-osc)}
.t-a{background:var(--ambar-s);color:var(--ambar)}
.t-b{background:var(--azul-s);color:var(--azul)}
.t-n{background:#EFEEED;color:var(--gris)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.row:hover{border-color:#CFCBC8}
.row .ti{font-weight:700;font-size:15px}
.row .su{color:var(--gris);font-size:13px;grid-column:1/-1}
.row .su b{color:var(--tinta);font-weight:600}
.row .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .big{font-weight:800;font-size:16px}
.row .big small{font-size:12px;color:var(--gris);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--gris)}
.empty b{display:block;color:var(--tinta);margin-bottom:4px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .lab{color:var(--tinta);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:12px;background:var(--fondo);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--naranja);border-radius:6px}
.bar.g .tr i{background:var(--gris-pv)}
.bar .v{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--gris);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--linea);background:#FAFAF9;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 10px;border-bottom:1px solid #F0EEEC;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
.cell{display:inline-block;min-width:54px;text-align:center;padding:3px 6px;border-radius:7px;font-size:12px;font-weight:600;background:var(--fondo);color:var(--gris)}
.cell.has{background:var(--naranja-suave);color:var(--naranja-osc)}
.cell small{display:block;font-size:10px;font-weight:600;color:var(--gris)}
/* FAB */
.fab{position:fixed;right:18px;bottom:22px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fab .main{width:58px;height:58px;border-radius:50%;background:var(--naranja);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 8px 22px rgba(251,83,20,.4);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.fab.open .main{transform:rotate(45deg)}
.fab .opt{display:none;background:#fff;border:1px solid var(--linea);border-radius:999px;padding:10px 16px;box-shadow:var(--sombra);cursor:pointer;font-weight:600;font-size:14px;align-items:center;gap:8px}
.fab.open .opt{display:inline-flex}
.fab .opt i{width:10px;height:10px;border-radius:50%;background:var(--naranja);font-style:normal}
.fab .opt.r i{background:var(--rojo)} .fab .opt.g i{background:var(--gris-pv)}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(30,30,30,.45);z-index:40;display:none}
.overlay.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--fondo);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{background:#fff;border-bottom:1px solid var(--linea);padding:14px 18px;display:flex;gap:12px;align-items:center}
.dh h3{margin:0;font-size:17px;font-weight:800}
.dh small{display:block;color:var(--gris);font-weight:500;font-size:12.5px}
.dh .sp{flex:1}
.db{overflow:auto;padding:16px 18px 40px;flex:1}
.sec2{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label.fl{display:block;font-size:13px;font-weight:700;color:var(--tinta);margin-bottom:5px}
label.fl span{color:var(--gris);font-weight:500}
.in{width:100%;padding:11px 12px;border:1.5px solid #DAD7D4;border-radius:10px;background:#fff;font-size:16px}
.in:focus{outline:3px solid var(--naranja-borde);border-color:var(--naranja)}
textarea.in{min-height:80px;resize:vertical}
.hint{font-size:12px;color:var(--gris);margin-top:4px}
.seg{display:flex;background:var(--fondo);border:1px solid var(--linea);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-weight:600;cursor:pointer;color:var(--gris);font-size:14px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--linea);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--gris)}
.chips button.on{background:var(--naranja);border-color:var(--naranja);color:#fff}
.chips .grp{width:100%;font-size:11px;font-weight:700;color:var(--gris2);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
.actions .sp{flex:1}
.meta{font-size:12px;color:var(--gris);margin-top:10px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#fff 0%,var(--fondo) 100%)}
.lg{background:#fff;border:1px solid var(--linea);border-radius:20px;padding:28px 26px;width:min(420px,100%);box-shadow:0 14px 40px rgba(0,0,0,.08)}
.lg img{height:46px;display:block;margin:0 auto 10px}
.lg h1{font-size:19px;margin:0 0 2px;text-align:center;font-weight:800}
.lg p{margin:0 0 20px;text-align:center;color:var(--gris);font-size:13.5px}
.lg .in{margin-bottom:12px}
.pin{letter-spacing:.4em;text-align:center;font-size:22px!important}
.err{background:var(--rojo-s);color:var(--rojo);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.toast.bad{background:var(--rojo)}
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(30,30,30,.45);padding:20px}
.modal.on{display:grid}
.modal .bx{background:#fff;border-radius:16px;padding:22px;width:min(380px,100%)}
.modal .bx p{margin:0 0 16px;font-weight:500}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:50px;text-align:center;color:var(--gris)}
.hidden{display:none!important}
@media(max-width:560px){
  header{padding:8px 12px;gap:10px}
  header img{height:28px}
  header .t b{font-size:13.5px}
  header .t small{display:none}
  header .chip span{display:none}
  header .chip{padding:3px}
  main{padding:14px 12px 110px}
  .kpi .n{font-size:22px}
}
@media print{header,nav,.fab{display:none}}
</style>
</head>

<!-- ============ LOGIN ============ -->
<div id="login">

</div>

<script>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function mesActual() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function hoyISO() { return fechaLocalISO(new Date()).slice(0, 10); }
function primerDiaMes() { return mesActual() + '-01'; }
function fechaLocalISO(d) { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function pd(iso) { if (!iso) return null; const s = String(iso); if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); } return new Date(s); }
function fmtF(iso) { if (!iso) return '—'; const d = pd(iso); if (isNaN(d)) return '—'; return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: d.getFullYear() !== new Date().getFullYear() ? '2-digit' : undefined }); }
function fmtFH(iso) { if (!iso) return '—'; const d = pd(iso); if (isNaN(d)) return '—'; return fmtF(iso) + ' ' + d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }); }
function minutos(a) { if (!a.inicio) return 0; const f = a.fin ? new Date(a.fin) : new Date(); return Math.max(0, Math.round((f - new Date(a.inicio)) / 60000)); }
function fmtMin(m) { if (!m) return '0 min'; const h = Math.floor(m / 60), r = m % 60; return h ? `${h} h ${r ? r + ' min' : ''}`.trim() : `${r} min`; }
function n0(v) { const x = parseFloat(v); return isNaN(x) ? 0 : x; }
function fmtN(v, d = 0) { return n0(v).toLocaleString('es-CO', { maximumFractionDigits: d, minimumFractionDigits: 0 }); }
function fmtCOP(v) { return n0(v) ? '$' + fmtN(v) : '—'; }
function enMes(iso, mes) { return !!iso && String(iso).slice(0, 7) === mes; }
function enRango(iso) { if (!iso) return false; const d = String(iso).slice(0, 10); return d >= filtros.desde && d <= filtros.hasta; }

/* Surtidores / caras / mangueras */
function layout() { const l = cfg().layout; return Array.isArray(l) && l.length ? l : LAYOUT_DEF; }
function nombreSurt(i) { const id = typeof i === 'string' ? i : 'S' + i; return (cfg().nombresSurtidores || {})[id] || id; }
function surtidores() { return layout().map(s => ({ id: s.id, isla: s.isla, gnv: !!s.gnv, nombre: nombreSurt(s.id), caras: s.caras })); }
function surtDe(sid) { return layout().find(s => s.id === sid) || { id: sid, caras: [] }; }
function carasDe(sid) { return surtDe(sid).caras.map(c => sid + '-C' + c.n); }
function caraObj(cid) { if (!cid) return null; const [sid, k] = String(cid).split('-C'); return surtDe(sid).caras.find(c => String(c.n) === k) || null; }
function mangueras(cid) { const c = caraObj(cid); return c ? c.mangueras.map(m => ({ id: 'M' + m.n, p: m.p })) : []; }
function islas() { const m = {}; layout().filter(x => !x.gnv).forEach(x => { m[x.isla] = m[x.isla] || []; m[x.isla].push(x.id); }); return Object.keys(m).sort((a, b) => a - b).map(k => ({ n: +k, surtidores: m[k] })); }
function posDe(a) {
  const todos = layout();
  let sel;
  if (a.alcance === 'Toda la EDS') sel = todos.flatMap(x => x.caras.map(c => ({ gnv: !!x.gnv })));
  else if (a.alcance === 'Caras') sel = (a.caras || []).map(cid => ({ gnv: !!surtDe(String(cid).split('-C')[0]).gnv }));
  else sel = (a.surtidores || []).flatMap(sid => surtDe(sid).caras.map(() => ({ gnv: !!surtDe(sid).gnv })));
  if (a.producto === 'Líquidos') sel = sel.filter(x => !x.gnv); else if (a.producto === 'GNV') sel = sel.filter(x => x.gnv);
  return { liq: sel.filter(x => !x.gnv).length, gnv: sel.filter(x => x.gnv).length };
}
function carasSel(a) {
  if (a.alcance === 'Toda la EDS') return layout().flatMap(x => x.caras.map(c => ({ ...c, gnv: !!x.gnv })));
  if (a.alcance === 'Caras') return (a.caras || []).map(cid => { const sd = surtDe(String(cid).split('-C')[0]); const c = caraObj(cid); return c ? { ...c, gnv: !!sd.gnv } : null; }).filter(Boolean);
  return (a.surtidores || []).flatMap(sid => surtDe(sid).caras.map(c => ({ ...c, gnv: !!surtDe(sid).gnv })));
}
function factorHorario(ini, fin) {
  const perfil = cfg().perfilHora || PERFIL_HORA_DEF; if (!ini || !fin || fin <= ini) return 1;
  let t = new Date(ini), suma = 0, mins = 0;
  while (t < fin) { const sig = new Date(t); sig.setMinutes(sig.getMinutes() + 1); const paso = Math.min(sig, fin) - t; suma += (perfil[t.getHours()] ?? 1) * paso; mins += paso; t = sig; if (mins > 7 * 86400000) break; }
  return mins ? suma / mins : 1;
}
function estimarPerdida(a) {
  const c = cfg(), ini = a.inicio ? new Date(a.inicio) : null, fin = a.fin ? new Date(a.fin) : new Date();
  const horas = ini ? Math.max(0, (fin - ini) / 3600000) : 0, f = factorHorario(ini, fin);
  let sel = carasSel(a);
  if (a.producto === 'Líquidos') sel = sel.filter(x => !x.gnv); else if (a.producto === 'GNV') sel = sel.filter(x => x.gnv);
  const gal = sel.filter(x => !x.gnv).reduce((t, x) => t + (n0(x.gh) || c.galHoraPos), 0) * horas * f;
  const m3 = sel.filter(x => x.gnv).reduce((t, x) => t + (n0(x.mh) || c.m3HoraPos), 0) * horas * f;
  return { gal: Math.round(gal * 10) / 10, m3: Math.round(m3 * 10) / 10, factor: f, liq: sel.filter(x => !x.gnv).length, gnv: sel.filter(x => x.gnv).length };
}
function totalPosiciones() { return layout().reduce((t, s) => t + s.caras.length, 0); }
function totalMangueras() { return layout().reduce((t, s) => t + s.caras.reduce((u, c) => u + c.mangueras.length, 0), 0); }
function numCara(cid) { return String(cid || '').split('-C')[1] || ''; }
function labelCara(c) { const [sid] = String(c).split('-C'); return nombreSurt(sid) + ' · Cara ' + numCara(c); }

/* ========== RED ========== */
async function api(action, extra = {}) {
  if (!gasUrl()) throw new Error('Falta la URL del Apps Script');
  const r = await fetch(gasUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, usuario: sesion.nombre, pin: sesion.pin, ...extra }), redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'pin') { toast('PIN o usuario no válido', true); sesion.pin = ''; guardarSesion(); mostrarLogin(); }
    throw new Error(j.error || 'error');
  }
  return j;
}
function guardarSesion() { try { localStorage.setItem(LS + '_s', JSON.stringify(sesion)); } catch (x) {} }

async function cargar() {
  $('#main').innerHTML = '<div class="loading">Cargando datos…</div>';
  try {
    const j = await api('list');
    S.af = j.afectaciones || []; S.mt = j.mantenimiento || []; S.dn = j.danos || [];
    S.cfg = { ...CFG_DEF, ...(j.cfg || {}) }; S.sheetUrl = j.sheetUrl || ''; S.usuarios = j.usuarios || [];
    sesion.rol = j.rol || sesion.rol; guardarSesion();
    $('#tabCfg').classList.toggle('hidden', !esAdmin());
    render();
  } catch (e) { $('#main').innerHTML = `<div class="empty"><b>No se pudo cargar</b>${esc(e.message)}<br><br><button class="btn" onclick="cargar()">Reintentar</button></div>`; }
}

$('#lgBtn').onclick = async () => {

function entrar() {

/* ========== VISTAS ========== */
function selMes(extra = '') { return `<input type="month" class="f" data-f="mes" value="${filtros.mes}" ${extra}>`; }
function kpi(n, l, cls = '', unit = '') { return `<div class="kpi ${cls}"><div class="n">${n}${unit ? `<small>${unit}</small>` : ''}</div><div class="l">${l}</div></div>`; }

function vInicio() {
  const mes = filtros.mes;
  const afM = S.af.filter(a => enMes(a.inicio, mes)), mtM = S.mt.filter(x => enMes(x.fecha, mes));
  const abiertas = S.af.filter(a => !a.fin), dnAb = S.dn.filter(d => d.estado !== 'Reparado');
  const min = afM.reduce((s, a) => s + minutos(a), 0), gal = afM.reduce((s, a) => s + n0(a.galones), 0), m3 = afM.reduce((s, a) => s + n0(a.m3), 0);
  const mesTxt = new Date(mes + '-02').toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });

  let html = `<div class="toolbar"><div><b style="font-size:17px">Resumen de ${esc(mesTxt)}</b></div><div class="sp"></div>${selMes()}</div>`;
  abiertas.forEach(a => html += `<div class="alert"><div><b>⚠ Afectación abierta · ${esc(a.motivo)}</b>Desde ${fmtFH(a.inicio)} · ${fmtMin(minutos(a))} · ${esc(alcanceTxt(a))}</div><div class="sp"></div><button class="btn sm" data-open-af="${a.id}">Ver</button><button class="btn pri sm" data-cerrar-af="${a.id}">Cerrar ahora</button></div>`);
  if (!abiertas.length) html += `<div class="alert ok"><div><b>✓ Sin afectaciones abiertas</b>Todas las posiciones de llenado operando.</div></div>`;

  html += `<div class="kpis">${kpi(afM.length, 'Afectaciones', 'r')}${kpi(fmtMin(min), 'Tiempo afectado', 'r')}${kpi(fmtN(gal), 'Galones no vendidos (est.)', 'o', 'gal')}${kpi(fmtN(m3), 'm³ GNV no vendidos (est.)', 'o', 'm³')}${kpi(mtM.reduce((s, x) => s + (n0(x.cantidad) || 1), 0), 'Partes cambiadas', '')}${kpi(dnAb.length, 'Daños locativos abiertos', dnAb.length ? 'o' : 'g')}</div>`;

  const tarjeta = s => {
    const caras = carasDe(s.id);
    const afS = afM.filter(a => (a.surtidores || []).includes(s.id) || (a.caras || []).some(c => c.startsWith(s.id + '-')) || a.alcance === 'Toda la EDS');
    const mtS = mtM.filter(x => x.surtidor === s.id);
    const lector = S.mt.filter(x => x.surtidor === s.id && x.parte === 'Lector').sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
    const abierta = abiertas.some(a => (a.surtidores || []).includes(s.id) || (a.caras || []).some(c => c.startsWith(s.id + '-')) || a.alcance === 'Toda la EDS');
    return `<div class="surt" data-surt="${s.id}"><div class="h"><b>${esc(s.nombre)} <small style="font-weight:600;color:var(--gris);font-size:12px">${s.gnv ? 'GNV' : 'Isla ' + s.isla}</small></b>${abierta ? '<span class="tag t-r">Afectado</span>' : ''}</div><div class="caras">${caras.map(c => {
      const hasAf = afM.some(a => (a.caras || []).includes(c)), hasMt = mtS.some(x => x.cara === c);
      return `<div class="cara ${hasAf ? 'af' : ''} ${hasMt ? 'mt' : ''}" title="${esc(labelCara(c))}">C${numCara(c)}</div>`; }).join('')}</div>
      <div class="m"><span><b>${afS.length}</b> afect.</span><span><b>${mtS.length}</b> cambios</span><span title="Último cambio de lector">Lector: <b>${lector ? fmtF(lector.fecha) : '—'}</b></span></div></div>`;
  };
  html += `<h2 class="sec">Surtidores de líquidos · ${esc(mesTxt)}</h2><div class="grid-s">${surtidores().filter(s => !s.gnv).map(tarjeta).join('')}</div>`;
  html += `<h2 class="sec">GNV · ${esc(mesTxt)}</h2><div class="grid-s">${surtidores().filter(s => s.gnv).map(tarjeta).join('')}`;
  html += `</div><div class="hint" style="margin-top:8px">Cara roja = tuvo afectación en el mes · Cara naranja = cambio de parte en el mes. Toca un surtidor para ver su mantenimiento.</div>`;

  html += `<div class="two" style="margin-top:18px"><div class="card pad"><h2 class="sec" style="margin-top:0">Motivos de afectación (tiempo)</h2>${barras(agrupar(afM, 'motivo', a => minutos(a)), fmtMin)}</div>
    <div class="card pad"><h2 class="sec" style="margin-top:0">Partes cambiadas</h2>${barras(agrupar(mtM, 'parte', x => n0(x.cantidad) || 1), v => fmtN(v), 'g')}</div></div>`;
  return html;
}

function agrupar(arr, campo, val) { const m = {}; arr.forEach(x => { const k = x[campo] || 'Sin dato'; m[k] = (m[k] || 0) + val(x); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function barras(pares, fmt, cls = '') {
  if (!pares.length) return '<div class="empty" style="padding:20px">Sin datos en este periodo</div>';
  const max = Math.max(...pares.map(p => p[1])) || 1;
  return `<div class="bars">${pares.map(([k, v]) => `<div class="bar ${cls}"><div class="lab" title="${esc(k)}">${esc(k)}</div><div class="tr"><i style="width:${Math.max(3, v / max * 100)}%"></i></div><div class="v">${fmt(v)}</div></div>`).join('')}</div>`;
}
function alcanceTxt(a) {
  if (a.alcance === 'Toda la EDS') return 'Toda la EDS';
  if (a.alcance === 'Isla / POS') return (a.islas || []).map(i => 'POS / Isla ' + i).join(', ') + ' (' + (a.surtidores || []).map(nombreSurt).join(', ') + ')';
  if (a.alcance === 'Surtidores') return (a.surtidores || []).map(s => nombreSurt(s)).join(', ') || 'Surtidores';
  if (a.alcance === 'Caras') return (a.caras || []).map(labelCara).join(', ') || 'Caras';
  return a.alcance || '';
}

function vAf() {
  let arr = S.af.filter(a => enMes(a.inicio, filtros.mes) || (!a.fin));
  if (filtros.afEstado) arr = arr.filter(a => (a.fin ? 'Cerrada' : 'Abierta') === filtros.afEstado);
  if (filtros.afMotivo) arr = arr.filter(a => a.motivo === filtros.afMotivo);
  arr.sort((a, b) => (b.inicio || '').localeCompare(a.inicio || ''));
  let html = `<div class="toolbar">${selMes()}<select class="f" data-f="afEstado"><option value="">Todas</option><option ${filtros.afEstado === 'Abierta' ? 'selected' : ''}>Abierta</option><option ${filtros.afEstado === 'Cerrada' ? 'selected' : ''}>Cerrada</option></select>
    <select class="f" data-f="afMotivo"><option value="">Todos los motivos</option>${MOTIVOS.map(m => `<option ${filtros.afMotivo === m ? 'selected' : ''}>${m}</option>`).join('')}</select><div class="sp"></div><button class="btn pri" data-new="af">+ Nueva afectación</button></div>`;
  if (!arr.length) return html + `<div class="card empty"><b>Sin afectaciones en este periodo</b>Cuando algo impida vender (POS, obra, bloqueo, carro varado…) repórtalo con el botón +.</div>`;
  html += `<div class="list">${arr.map(a => `<div class="row" data-open-af="${a.id}"><div><div class="ti">${esc(a.motivo)} <span class="tag ${a.fin ? 't-g' : 't-r'}">${a.fin ? 'Cerrada' : 'Abierta'}</span></div></div>
    <div class="rt"><div class="big">${fmtMin(minutos(a))}</div><small class="muted" style="font-size:12px;color:var(--gris)">${fmtN(a.galones)} gal · ${fmtN(a.m3)} m³</small></div>
    <div class="su"><b>${esc(a.consecutivo || '')}</b> · ${fmtFH(a.inicio)}${a.fin ? ' → ' + fmtFH(a.fin) : ''} · ${esc(alcanceTxt(a))} · <b>${esc(a.producto || '')}</b> · reportó ${esc(a.reportadoPor || '')}${a.descripcion ? '<br>' + esc(a.descripcion) : ''}</div></div>`).join('')}</div>`;
  return html;
}

function vMt() {
  let arr = S.mt.filter(x => enMes(x.fecha, filtros.mes));
  if (filtros.mtSurt) arr = arr.filter(x => x.surtidor === filtros.mtSurt);
  if (filtros.mtParte) arr = arr.filter(x => x.parte === filtros.mtParte);
  arr.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  let html = `<div class="toolbar">${selMes()}<select class="f" data-f="mtSurt"><option value="">Todos los surtidores</option>${surtidores().map(s => `<option value="${s.id}" ${filtros.mtSurt === s.id ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}${EQUIPOS.map(e => `<option ${filtros.mtSurt === e ? 'selected' : ''}>${e}</option>`).join('')}</select>
    <select class="f" data-f="mtParte"><option value="">Todas las partes</option>${PARTES.map(p => `<option ${filtros.mtParte === p ? 'selected' : ''}>${p}</option>`).join('')}</select><div class="sp"></div><button class="btn pri" data-new="mt">+ Cambio de parte</button></div>`;

  // Matriz último cambio
  html += `<div class="card"><div class="pad" style="padding-bottom:6px"><b>Último cambio por surtidor</b> <span class="hint" style="display:inline">(fecha · total histórico)</span></div><div class="tw"><table><thead><tr><th>Parte</th>${surtidores().map(s => `<th style="text-align:center">${esc(s.nombre)}</th>`).join('')}</tr></thead><tbody>`;
  PARTES.filter(p => p !== 'Otro' && NIVEL[p] !== 'equipo').forEach(p => {
    html += `<tr><td><b>${p}</b></td>${surtidores().map(s => { const xs = S.mt.filter(x => x.surtidor === s.id && x.parte === p); const ult = xs.map(x => x.fecha).sort().pop(); const n = xs.reduce((t, x) => t + (n0(x.cantidad) || 1), 0);
      return `<td style="text-align:center"><span class="cell ${n ? 'has' : ''}">${ult ? fmtF(ult) : '—'}${n ? `<small>${n} cambio${n > 1 ? 's' : ''}</small>` : ''}</span></td>`; }).join('')}</tr>`;
  });
  html += `</tbody></table></div></div>`;
  const eqs = S.mt.filter(x => esEquipo(x.surtidor));
  html += `<div class="card pad" style="margin-top:12px"><b>Otros equipos</b> <span class="hint" style="display:inline">(no son de surtidor)</span><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px">${EQUIPOS.map(e => { const xs = eqs.filter(x => x.surtidor === e); const ult = xs.map(x => x.fecha).sort().pop(); return `<div><div style="font-size:13px;font-weight:600">${esc(e)}</div><span class="cell ${xs.length ? 'has' : ''}">${ult ? fmtF(ult) : '—'}${xs.length ? `<small>${xs.length} cambio${xs.length > 1 ? 's' : ''}</small>` : ''}</span></div>`; }).join('')}</div></div>
  <h2 class="sec">Registros del mes</h2>`;
  if (!arr.length) return html + `<div class="card empty"><b>Sin cambios registrados</b>Registra cada manguera, manguera corta, codo, breakaway, pistola (por manguera 1-36), filtro (por surtidor), lector (por cara) o válvula de aire de la máquina de llantas.</div>`;
  html += `<div class="list">${arr.map(x => `<div class="row" data-open-mt="${x.id}"><div><div class="ti">${esc(x.parte)} <span class="tag t-o">${esc(nombreSurt(x.surtidor))}${x.cara ? ' · Cara ' + esc(numCara(x.cara)) : ''}${x.manguera ? ' · ' + esc(x.manguera) : ''}</span></div></div>
    <div class="rt"><div class="big">${fmtF(x.fecha)}</div>${n0(x.costo) ? `<small style="font-size:12px;color:var(--gris)">${fmtCOP(x.costo)}</small>` : ''}</div>
    <div class="su">${[`<b>${esc(x.consecutivo || '')}</b>`, esc(x.producto), esc(x.motivo), 'cant. ' + (n0(x.cantidad) || 1), esc(x.tecnico), 'reportó ' + esc(x.reportadoPor)].filter(Boolean).join(' · ')}${x.observaciones ? '<br>' + esc(x.observaciones) : ''}</div></div>`).join('')}</div>`;
  return html;
}

function vDn() {
  let arr = S.dn.slice();
  if (filtros.dnEstado) arr = arr.filter(d => (d.estado || 'Reportado') === filtros.dnEstado); else arr = arr.filter(d => d.estado !== 'Reparado' || enMes(d.fechaReparacion || d.fecha, filtros.mes));
  if (filtros.dnArea) arr = arr.filter(d => d.area === filtros.dnArea);
  const ord = { Alta: 0, Media: 1, Baja: 2 };
  arr.sort((a, b) => (a.estado === 'Reparado') - (b.estado === 'Reparado') || (ord[a.prioridad] ?? 1) - (ord[b.prioridad] ?? 1) || (b.fecha || '').localeCompare(a.fecha || ''));
  let html = `<div class="toolbar">${selMes()}<select class="f" data-f="dnEstado"><option value="">Pendientes + reparados del mes</option>${ESTADOS_DN.map(e => `<option ${filtros.dnEstado === e ? 'selected' : ''}>${e}</option>`).join('')}</select>
    <select class="f" data-f="dnArea"><option value="">Todas las áreas</option>${AREAS.map(a => `<option ${filtros.dnArea === a ? 'selected' : ''}>${a}</option>`).join('')}</select><div class="sp"></div><button class="btn pri" data-new="dn">+ Daño locativo</button></div>`;
  const ab = S.dn.filter(d => d.estado !== 'Reparado');
  html += `<div class="kpis" style="margin-bottom:14px">${kpi(ab.length, 'Pendientes', ab.length ? 'o' : 'g')}${kpi(ab.filter(d => d.prioridad === 'Alta').length, 'Prioridad alta', 'r')}${kpi(S.dn.filter(d => d.estado === 'Reparado' && enMes(d.fechaReparacion, filtros.mes)).length, 'Reparados en el mes', 'g')}${kpi(fmtCOP(S.dn.filter(d => enMes(d.fechaReparacion || d.fecha, filtros.mes)).reduce((s, d) => s + n0(d.costo), 0)), 'Costo reparaciones del mes')}</div>`;
  if (!arr.length) return html + `<div class="card empty"><b>Sin daños registrados</b>Baños, jardines, sifones, llaves, techo… repórtalos aquí para hacerles seguimiento.</div>`;
  const tagE = e => e === 'Reparado' ? 't-g' : e === 'En reparación' ? 't-b' : 't-a';
  const tagP = p => p === 'Alta' ? 't-r' : p === 'Media' ? 't-o' : 't-n';
  html += `<div class="list">${arr.map(d => `<div class="row" data-open-dn="${d.id}"><div><div class="ti">${esc(d.area)}${d.elemento ? ' · ' + esc(d.elemento) : ''} <span class="tag ${tagE(d.estado)}">${esc(d.estado || 'Reportado')}</span> <span class="tag ${tagP(d.prioridad)}">${esc(d.prioridad || 'Media')}</span></div></div>
    <div class="rt"><div class="big">${fmtF(d.fecha)}</div><small style="font-size:12px;color:var(--gris)">${d.estado === 'Reparado' ? 'reparado ' + fmtF(d.fechaReparacion) : diasAbierto(d) + ' días abierto'}</small></div>
    <div class="su"><b>${esc(d.consecutivo || '')}</b>${d.ubicacion ? ' · ' + esc(d.ubicacion) : ''} · ${esc(d.descripcion || '')}${d.reparadoPor ? ' · reparó ' + esc(d.reparadoPor) : ''}${n0(d.costo) ? ' · ' + fmtCOP(d.costo) : ''} · reportó ${esc(d.reportadoPor || '')}</div></div>`).join('')}</div>`;
  return html;
}
function diasAbierto(d) { if (!d.fecha) return 0; const f = d.fechaReparacion ? pd(d.fechaReparacion) : new Date(); return Math.max(0, Math.floor((f - pd(d.fecha)) / 86400000)); }

function vInf() {
  const af = S.af.filter(a => enRango(a.inicio)), mt = S.mt.filter(x => enRango(x.fecha)), dn = S.dn.filter(d => enRango(d.fecha));
  const min = af.reduce((s, a) => s + minutos(a), 0);
  let html = `<div class="toolbar"><label style="font-size:13px;font-weight:600">Desde <input type="date" class="f" data-f="desde" value="${filtros.desde}"></label><label style="font-size:13px;font-weight:600">Hasta <input type="date" class="f" data-f="hasta" value="${filtros.hasta}"></label><div class="sp"></div>
    ${S.sheetUrl ? `<a class="btn" href="${esc(S.sheetUrl)}" target="_blank" rel="noopener">Abrir hoja de Google</a>` : ''}<button class="btn pri" id="btnExcel">⬇ Descargar Excel</button></div>`;
  html += `<div class="kpis">${kpi(af.length, 'Afectaciones', 'r')}${kpi(fmtMin(min), 'Tiempo afectado', 'r')}${kpi(fmtN(af.reduce((s, a) => s + n0(a.galones), 0)), 'Galones no vendidos', 'o', 'gal')}${kpi(fmtN(af.reduce((s, a) => s + n0(a.m3), 0)), 'm³ GNV no vendidos', 'o', 'm³')}${kpi(mt.reduce((s, x) => s + (n0(x.cantidad) || 1), 0), 'Partes cambiadas')}${kpi(fmtCOP(mt.reduce((s, x) => s + n0(x.costo), 0) + dn.reduce((s, d) => s + n0(d.costo), 0)), 'Costo partes + reparaciones')}</div>`;

  // Motivos
  const mot = {}; af.forEach(a => { const k = a.motivo || 'Sin dato'; mot[k] = mot[k] || { n: 0, min: 0, gal: 0, m3: 0 }; mot[k].n++; mot[k].min += minutos(a); mot[k].gal += n0(a.galones); mot[k].m3 += n0(a.m3); });
  html += `<h2 class="sec">Afectaciones por motivo</h2><div class="card tw"><table><thead><tr><th>Motivo</th><th class="num">Veces</th><th class="num">Tiempo</th><th class="num">Galones</th><th class="num">m³ GNV</th></tr></thead><tbody>${Object.entries(mot).sort((a, b) => b[1].min - a[1].min).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v.n}</td><td class="num">${fmtMin(v.min)}</td><td class="num">${fmtN(v.gal)}</td><td class="num">${fmtN(v.m3)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Sin afectaciones en el rango</td></tr>'}</tbody></table></div>`;

  // Partes × surtidor
  html += `<h2 class="sec">Partes cambiadas por surtidor</h2><div class="card tw"><table><thead><tr><th>Parte</th>${surtidores().map(s => `<th class="num">${esc(s.nombre)}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>`;
  PARTES.forEach(p => { const fila = surtidores().map(s => mt.filter(x => x.surtidor === s.id && x.parte === p).reduce((t, x) => t + (n0(x.cantidad) || 1), 0)); const tot = fila.reduce((a, b) => a + b, 0); if (!tot) return;
    html += `<tr><td>${p}</td>${fila.map(v => `<td class="num">${v || '·'}</td>`).join('')}<td class="num"><b>${tot}</b></td></tr>`; });
  html += `</tbody></table></div>`;

  // Lectores por cara
  const lect = mt.filter(x => x.parte === 'Lector');
  if (lect.length) html += `<h2 class="sec">Cambios de lector por cara</h2><div class="card tw"><table><thead><tr><th>Fecha</th><th>Surtidor</th><th>Cara</th><th>Motivo</th><th>Técnico</th><th>Reportó</th></tr></thead><tbody>${lect.sort((a, b) => b.fecha.localeCompare(a.fecha)).map(x => `<tr><td>${fmtF(x.fecha)}</td><td>${esc(nombreSurt(x.surtidor))}</td><td>${x.cara ? 'Cara ' + esc(numCara(x.cara)) : '—'}</td><td>${esc(x.motivo || '')}</td><td>${esc(x.tecnico || '')}</td><td>${esc(x.reportadoPor || '')}</td></tr>`).join('')}</tbody></table></div>`;

  // Daños por área
  const ar = {}; dn.forEach(d => { const k = d.area || 'Sin dato'; ar[k] = ar[k] || { n: 0, pend: 0, costo: 0 }; ar[k].n++; if (d.estado !== 'Reparado') ar[k].pend++; ar[k].costo += n0(d.costo); });
  html += `<h2 class="sec">Daños locativos por área</h2><div class="card tw"><table><thead><tr><th>Área</th><th class="num">Reportados</th><th class="num">Pendientes</th><th class="num">Costo</th></tr></thead><tbody>${Object.entries(ar).sort((a, b) => b[1].n - a[1].n).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v.n}</td><td class="num">${v.pend}</td><td class="num">${fmtCOP(v.costo)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin daños en el rango</td></tr>'}</tbody></table></div>`;
  html += `<div class="hint" style="margin-top:12px">El Excel incluye el detalle completo de afectaciones, mantenimiento y daños del rango, más las tablas resumen. La hoja de Google tiene todo el histórico.</div>`;
  return html;
}

function vCfg() {
  const c = cfg();
  let html = `<div class="card pad"><b style="font-size:16px">Configuración de la estación</b><div class="hint">Solo la administradora puede cambiar esto. Afecta los formularios y los cálculos estimados.</div>
    <div class="grid" style="margin-top:14px">
      <div><label class="fl">Productos <span>(separados por coma)</span></label><input class="in" id="cProd" value="${esc((c.productos || []).join(', '))}"></div>
      <div><label class="fl">Galones/h por cara <span>(solo si una cara no tiene dato propio)</span></label><input class="in" type="number" step="0.1" id="cGal" value="${c.galHoraPos}"></div>
      <div><label class="fl">m³ GNV por hora por cara</label><input class="in" type="number" step="0.1" id="cM3" value="${c.m3HoraPos}"></div>
      <div class="full"><label class="fl">Nombres de surtidores <span>(opcional, ej: S1=Isla 1 Norte, S2=Isla 1 Sur)</span></label><input class="in" id="cNom" value="${esc(Object.entries(c.nombresSurtidores || {}).map(([k, v]) => k + '=' + v).join(', '))}"></div>
    </div><div class="hint" style="margin-top:8px">Total posiciones de llenado: <b>${totalPosiciones()}</b> caras (${layout().filter(x => !x.gnv).reduce((t, x) => t + x.caras.length, 0)} líquidos + ${layout().filter(x => x.gnv).reduce((t, x) => t + x.caras.length, 0)} GNV) · <b>${totalMangueras()}</b> mangueras. Los gal/h de cada cara y el perfil horario vienen medidos del Terpel POS (1–7 nov 2026); se pueden actualizar en "Avanzado".</div>
    <div class="actions"><button class="btn pri" id="btnCfgSave">Guardar configuración</button></div></div>`;
  html += `<h2 class="sec">Distribución de surtidores (según Terpel POS)</h2><div class="card"><div class="tw"><table><thead><tr><th>Isla</th><th>Surtidor</th><th>Cara</th><th class="num">Venta/h</th><th>Mangueras</th></tr></thead><tbody>${layout().map(s => s.caras.map((cc, i) => `<tr>${i === 0 ? `<td rowspan="${s.caras.length}">${esc(String(s.isla))}</td><td rowspan="${s.caras.length}"><b>${esc(nombreSurt(s.id))}</b></td>` : ''}<td>Cara ${cc.n}</td><td class="num">${cc.gh ? fmtN(cc.gh, 1) + ' gal/h' : (s.gnv ? fmtN(cc.mh || c.m3HoraPos, 1) + ' m³/h' : '—')}</td><td>${cc.mangueras.map(m => `<span class="cell has" style="margin-right:4px">M${m.n}<small>${esc(m.p)}</small></span>`).join('')}</td></tr>`).join('')).join('')}</tbody></table></div>
    <div class="pad" style="padding-top:8px"><details><summary style="cursor:pointer;font-size:13px;color:var(--gris)">Avanzado: editar distribución (JSON)</summary><textarea class="in" id="cLayout" style="min-height:160px;font-family:ui-monospace,monospace;font-size:12px;margin-top:8px">${esc(JSON.stringify(layout()))}</textarea><div class="hint">Formato: lista de surtidores con id, isla y caras; cada cara con su número n, su venta gh (gal/h) o mh (m³/h) y sus mangueras (n y p = producto). Se guarda con el botón "Guardar configuración".</div></details></div></div>`;
  html += `<h2 class="sec">Usuarios que pueden reportar</h2><div class="card"><div class="tw"><table><thead><tr><th>Nombre</th><th>Cargo</th><th>Rol</th><th>Activo</th><th></th></tr></thead><tbody>${(S.usuarios || []).map(u => `<tr><td><b>${esc(u.nombre)}</b></td><td>${esc(u.cargo || '')}</td><td>${u.rol === 'admin' ? '<span class="tag t-o">Administrador</span>' : '<span class="tag t-n">Usuario</span>'}</td><td>${String(u.activo).toUpperCase() === 'NO' ? 'No' : 'Sí'}</td><td style="text-align:right"><button class="btn sm" data-user-edit="${esc(u.nombre)}">Editar</button></td></tr>`).join('')}</tbody></table></div><div class="pad" style="padding-top:8px"><button class="btn" id="btnNewUser">+ Agregar usuario</button> <span class="hint" style="display:inline">Los PIN también se pueden cambiar directamente en la hoja <b>Usuarios</b>.</span></div></div>`;
  return html;
}

/* ========== DRAWER / FORMULARIOS ========== */
let actual = null, tipoActual = '';
function abrir(tipo, id) {
  tipoActual = tipo;
  const col = tipo === 'af' ? S.af : tipo === 'mt' ? S.mt : S.dn;
  actual = id ? JSON.parse(JSON.stringify(col.find(x => x.id === id) || {})) : nuevo(tipo);
  const nuevoReg = !id;
  $('#dTitle').textContent = { af: nuevoReg ? 'Nueva afectación' : 'Afectación', mt: nuevoReg ? 'Nuevo cambio de parte' : 'Cambio de parte', dn: nuevoReg ? 'Nuevo daño locativo' : 'Daño locativo' }[tipo];
  $('#dSub').textContent = nuevoReg ? 'Reporta ' + sesion.nombre : `${actual.consecutivo || ''} · reportó ${actual.reportadoPor || ''} · últ. cambio ${fmtFH(actual.actualizado)} por ${actual.actualizadoPor || ''}`;
  $('#dBody').innerHTML = tipo === 'af' ? fAf() : tipo === 'mt' ? fMt() : fDn();
  bindForm();
  $('#overlay').classList.add('on'); $('#drawer').classList.add('on');
}
function cerrarDrawer() { $('#overlay').classList.remove('on'); $('#drawer').classList.remove('on'); }
$('#dClose').onclick = cerrarDrawer; $('#overlay').onclick = cerrarDrawer;

function nuevo(tipo) {
  const base = { id: uid(), reportadoPor: sesion.nombre, creado: new Date().toISOString() };
  if (tipo === 'af') return { ...base, motivo: '', producto: 'Líquidos', alcance: 'Caras', islas: [], surtidores: [], caras: [], inicio: fechaLocalISO(new Date()), fin: '', posiciones: '', galones: '', m3: '', descripcion: '' };
  if (tipo === 'mt') return { ...base, fecha: hoyISO(), surtidor: 'S1', cara: '', manguera: '', parte: '', producto: '', cantidad: 1, motivo: '', tecnico: '', costo: '', observaciones: '' };
  return { ...base, fecha: hoyISO(), estado: 'Reportado', area: '', elemento: '', ubicacion: '', prioridad: 'Media', descripcion: '', fechaReparacion: '', reparadoPor: '', costo: '', observaciones: '' };
}
const opt = (arr, v) => arr.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
const seg = (name, arr, v) => `<div class="seg" data-seg="${name}">${arr.map(x => `<button type="button" class="${x === v ? 'on' : ''}" data-val="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;

function fAf() {
  const a = actual, c = cfg();
  return `<div class="sec2"><div class="grid">
    <div class="full"><label class="fl">¿Qué pasó?</label><select class="in" data-k="motivo"><option value="">Elige el motivo…</option>${opt(MOTIVOS, a.motivo)}</select></div>
    <div class="full"><label class="fl">Producto afectado</label>${seg('producto', ['Líquidos', 'GNV', 'Ambos'], a.producto)}</div>
    <div><label class="fl">Inicio</label><input class="in" type="datetime-local" data-k="inicio" value="${esc(a.inicio || '')}"></div>
    <div><label class="fl">Fin <span>(vacío = sigue abierta)</span></label><input class="in" type="datetime-local" data-k="fin" value="${esc(a.fin || '')}"><div class="hint" id="durHint"></div></div>
  </div></div>

  body.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { const k = b.dataset.chip; actual[k] = actual[k] || []; const i = actual[k].indexOf(b.dataset.val); if (i >= 0) actual[k].splice(i, 1); else actual[k].push(b.dataset.val); b.classList.toggle('on'); postCambio(k); });

  const ms = $('#mtSurt'), mc = $('#mtCara'), mm = $('#mtMang'), me = $('#mtEquipo');
  const nivelUI = () => { if (tipoActual !== 'mt') return; const n = NIVEL[actual.parte] || 'libre'; const eq = n === 'equipo';
    $('#rowEquipo').style.display = eq ? '' : 'none'; $('#rowSurt').style.display = eq ? 'none' : ''; $('#rowCara').style.display = (eq || n === 'surtidor') ? 'none' : ''; $('#rowMang').style.display = (eq || n === 'surtidor' || n === 'cara') ? 'none' : '';
    const h = $('#mangHint'); if (h) h.textContent = n === 'manguera' ? '(1 a 36)' : '(opcional)';
    if (eq) { if (!esEquipo(actual.surtidor)) { actual.surtidor = me.value; } actual.cara = ''; actual.manguera = ''; } else if (esEquipo(actual.surtidor)) { actual.surtidor = ms.value; } };
  const mp = $('#dBody [data-k=parte]'); if (mp) mp.addEventListener('change', nivelUI);

  const llenarMang = () => { if (!mm) return; mm.innerHTML = '<option value="">—</option>' + mangueras(actual.cara).map(x => `<option value="${x.id}">${x.id} · ${esc(x.p)}</option>`).join(''); actual.manguera = ''; };

  if (mc) mc.addEventListener('change', llenarMang);
  if (mm) mm.addEventListener('change', () => { const x = mangueras(actual.cara).find(y => y.id === mm.value); const ps = $('#dBody [data-k=producto]'); if (x && ps) { actual.producto = x.p; ps.value = x.p; } });

function postCambio(k) {
  if (tipoActual !== 'af') {
    if (tipoActual === 'dn' && k === 'estado') { if (actual.estado === 'Reparado' && !actual.fechaReparacion) { actual.fechaReparacion = hoyISO(); const el = $('#dBody [data-k=fechaReparacion]'); if (el) el.value = actual.fechaReparacion; } }
    return;
  }
  if (k === 'motivo' && /GNV/.test(actual.motivo || '') && actual.producto !== 'GNV') { actual.producto = 'GNV'; $$('#dBody [data-seg=producto] button').forEach(b => b.classList.toggle('on', b.dataset.val === 'GNV')); if (/Bloqueo total/.test(actual.motivo)) { actual.alcance = 'Surtidores'; actual.surtidores = layout().filter(x => x.gnv).map(x => x.id); $$('#dBody [data-seg=alcance] button').forEach(b => b.classList.toggle('on', b.dataset.val === 'Surtidores')); $$('#dBody [data-chip=surtidores]').forEach(b => b.classList.toggle('on', actual.surtidores.includes(b.dataset.val))); } postCambio('producto'); postCambio('alcance'); return; }
  if (k === 'motivo' && actual.motivo === 'Caída Terpel POS' && !(actual.islas || []).length && !(actual.caras || []).length) { actual.alcance = 'Isla / POS'; $$('#dBody [data-seg=alcance] button').forEach(b => b.classList.toggle('on', b.dataset.val === actual.alcance)); postCambio('alcance'); return; }
  if (k === 'alcance') { $('#alcIsla').style.display = actual.alcance === 'Isla / POS' ? '' : 'none'; $('#alcSurt').style.display = actual.alcance === 'Surtidores' ? '' : 'none'; $('#alcCaras').style.display = actual.alcance === 'Caras' ? '' : 'none'; }
  if (k === 'islas' || (k === 'alcance' && actual.alcance === 'Isla / POS')) { actual.surtidores = islas().filter(i => (actual.islas || []).map(String).includes(String(i.n))).flatMap(i => i.surtidores); }
  if (['alcance', 'surtidores', 'caras', 'islas', 'producto'].includes(k)) {
    const pp = posDe(actual); actual.posLiq = pp.liq; actual.posGnv = pp.gnv; const pos = pp.liq + pp.gnv;
    actual.posiciones = pos; const el = $('#dBody [data-k=posiciones]'); if (el) el.value = pos;
  }
  if (k === 'producto') { const g = $('#dBody [data-k=galones]'), m = $('#dBody [data-k=m3]'); g.disabled = actual.producto === 'GNV'; m.disabled = actual.producto === 'Líquidos'; if (g.disabled) { g.value = ''; actual.galones = ''; } if (m.disabled) { m.value = ''; actual.m3 = ''; } }
  const h = $('#durHint'); if (h) h.textContent = actual.inicio ? (actual.fin ? 'Duración: ' + fmtMin(minutos(actual)) : 'Abierta hace ' + fmtMin(minutos(actual))) : '';
}
function estimar(silencioso) {
  const a = actual;
  if (!a.inicio) return toast('Pon la hora de inicio', true);
  const e = estimarPerdida(a);
  if (!(e.liq + e.gnv)) return silencioso ? null : toast('Indica el alcance o las posiciones afectadas', true);
  if (a.producto !== 'GNV') { a.galones = e.gal; $('#dBody [data-k=galones]').value = a.galones; }
  if (a.producto !== 'Líquidos') { a.m3 = e.m3; $('#dBody [data-k=m3]').value = a.m3; }
  if (!silencioso) toast(`Estimado con el ritmo real de cada cara (factor horario ${e.factor.toFixed(2)}) · corrígelo si tienes el dato real`);
}

async function guardarActual() {
  const a = actual;
  if (tipoActual === 'af') { if (!a.motivo) return toast('Elige el motivo', true); if (!a.inicio) return toast('Pon la hora de inicio', true); if (a.fin && a.fin < a.inicio) return toast('El fin no puede ser antes del inicio', true); if (a.alcance === 'Surtidores' && !(a.surtidores || []).length) return toast('Marca los surtidores afectados', true); if (a.alcance === 'Isla / POS' && !(a.islas || []).length) return toast('Marca la isla / POS afectado', true); if (a.alcance === 'Caras' && !(a.caras || []).length) return toast('Marca las caras afectadas', true); }
  if (tipoActual === 'mt') { if (!a.parte) return toast('Elige la parte cambiada', true); if (!a.fecha) return toast('Pon la fecha', true); const n = NIVEL[a.parte] || 'libre';
    if (n === 'manguera' && !a.manguera) return toast('Indica la manguera (1 a 36)', true); if ((n === 'manguera' || n === 'cara') && !a.cara) return toast('Indica la cara', true); if (n !== 'equipo' && n !== 'libre' && !a.surtidor) return toast('Indica el surtidor', true); }
  if (tipoActual === 'dn') { if (!a.area) return toast('Elige el área', true); if (!a.descripcion) return toast('Describe el daño', true); if (a.estado === 'Reparado' && !a.fechaReparacion) a.fechaReparacion = hoyISO(); }
  const btn = $('#btnSave'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Guardando…';
  try {
    const accion = tipoActual === 'af' ? (a.fin ? 'Afectación cerrada / editada' : 'Afectación abierta') : undefined;
    await api({ af: 'saveAf', mt: 'saveMt', dn: 'saveDn' }[tipoActual], { item: a, accion });
    cerrarDrawer(); toast('Guardado ✓'); await cargar();
  } catch (e) { toast('No se pudo guardar: ' + e.message, true); btn.disabled = false; btn.textContent = 'Guardar'; }
}
async function eliminarActual() {
  if (!await confirmar('¿Eliminar este registro definitivamente?')) return;
  try { await api({ af: 'delAf', mt: 'delMt', dn: 'delDn' }[tipoActual], { id: actual.id }); cerrarDrawer(); toast('Eliminado'); await cargar(); } catch (e) { toast('No se pudo eliminar: ' + e.message, true); }
}
async function cerrarAf(id) {
  const a = S.af.find(x => x.id === id); if (!a) return;
  if (!await confirmar(`¿Cerrar la afectación "${a.motivo}" ahora (${fmtMin(minutos(a))})? Se calculará la pérdida estimada si no tiene dato.`)) return;
  const c = cfg(); a.fin = fechaLocalISO(new Date());
  const e = estimarPerdida(a);
  if (a.producto !== 'GNV' && !n0(a.galones)) a.galones = e.gal; if (a.producto !== 'Líquidos' && !n0(a.m3)) a.m3 = e.m3;
  try { await api('saveAf', { item: a, accion: 'Afectación cerrada' }); toast('Afectación cerrada ✓'); await cargar(); } catch (e) { toast('Error: ' + e.message, true); }
}

  const dn = S.dn.filter(d => enRango(d.fecha)).sort((a, b) => a.fecha.localeCompare(b.fecha));

  const wb = XLSX.utils.book_new();

  const hAf = [['Consecutivo', 'Estado', 'Fecha inicio', 'Fecha fin', 'Duración (min)', 'Duración (h)', 'Motivo', 'Producto', 'Alcance', 'Surtidores', 'Caras', 'Posiciones', 'Galones perdidos (est.)', 'm3 GNV perdidos (est.)', 'Descripción', 'Reportado por']];

  addSheet(wb, hAf, 'Afectaciones', [12, 9, 16, 16, 12, 10, 30, 10, 12, 18, 30, 10, 14, 14, 40, 18]);

  const hMt = [['Consecutivo', 'Fecha', 'Surtidor', 'Cara', 'Manguera', 'Parte', 'Producto', 'Cantidad', 'Motivo del cambio', 'Técnico / Proveedor', 'Costo', 'Observaciones', 'Reportado por']];
  mt.forEach(x => hMt.push([x.consecutivo, D(x.fecha), nombreSurt(x.surtidor), x.cara ? 'Cara ' + numCara(x.cara) : '', x.manguera || '', x.parte, x.producto || '', n0(x.cantidad) || 1, x.motivo || '', x.tecnico || '', n0(x.costo), x.observaciones || '', x.reportadoPor || '']));
  addSheet(wb, hMt, 'Mantenimiento', [12, 12, 12, 8, 10, 16, 10, 9, 22, 20, 12, 40, 18]);

  const hDn = [['Consecutivo', 'Estado', 'Fecha reporte', 'Fecha reparación', 'Días abierto', 'Área', 'Elemento', 'Ubicación', 'Prioridad', 'Descripción', 'Reparado por', 'Costo', 'Observaciones', 'Reportado por']];
  dn.forEach(d => hDn.push([d.consecutivo, d.estado, D(d.fecha), D(d.fechaReparacion), diasAbierto(d), d.area, d.elemento || '', d.ubicacion || '', d.prioridad || '', d.descripcion || '', d.reparadoPor || '', n0(d.costo), d.observaciones || '', d.reportadoPor || '']));
  addSheet(wb, hDn, 'Daños locativos', [12, 13, 13, 15, 10, 18, 20, 20, 9, 40, 18, 12, 30, 18]);

  // Resúmenes
  const res = [['INFORME · EDS Terpel Av. Boyacá · PLAN VE S.A.S'], ['Rango', filtros.desde + ' a ' + filtros.hasta], ['Generado', new Date().toLocaleString('es-CO'), 'por', sesion.nombre], [],
    ['AFECTACIONES POR MOTIVO'], ['Motivo', 'Veces', 'Minutos', 'Horas', 'Galones', 'm3 GNV']];
  const mot = {}; af.forEach(a => { const k = a.motivo || 'Sin dato'; mot[k] = mot[k] || [0, 0, 0, 0]; mot[k][0]++; mot[k][1] += minutos(a); mot[k][2] += n0(a.galones); mot[k][3] += n0(a.m3); });
  Object.entries(mot).sort((a, b) => b[1][1] - a[1][1]).forEach(([k, v]) => res.push([k, v[0], v[1], Math.round(v[1] / 60 * 100) / 100, v[2], v[3]]));
  res.push(['TOTAL', af.length, af.reduce((s, a) => s + minutos(a), 0), Math.round(af.reduce((s, a) => s + minutos(a), 0) / 60 * 100) / 100, af.reduce((s, a) => s + n0(a.galones), 0), af.reduce((s, a) => s + n0(a.m3), 0)]);
  res.push([], ['PARTES CAMBIADAS POR SURTIDOR'], ['Parte', ...surtidores().map(s => s.nombre), 'Total']);
  PARTES.forEach(p => { const fila = surtidores().map(s => mt.filter(x => x.surtidor === s.id && x.parte === p).reduce((t, x) => t + (n0(x.cantidad) || 1), 0)); res.push([p, ...fila, fila.reduce((a, b) => a + b, 0)]); });
  res.push([], ['CAMBIOS DE LECTOR POR CARA'], ['Fecha', 'Surtidor', 'Cara', 'Motivo', 'Técnico', 'Reportó']);
  mt.filter(x => x.parte === 'Lector').forEach(x => res.push([D(x.fecha), nombreSurt(x.surtidor), x.cara ? 'Cara ' + numCara(x.cara) : '', x.motivo || '', x.tecnico || '', x.reportadoPor || '']));
  res.push([], ['DAÑOS LOCATIVOS POR ÁREA'], ['Área', 'Reportados', 'Pendientes', 'Costo']);
  const ar = {}; dn.forEach(d => { const k = d.area || 'Sin dato'; ar[k] = ar[k] || [0, 0, 0]; ar[k][0]++; if (d.estado !== 'Reparado') ar[k][1]++; ar[k][2] += n0(d.costo); });
  Object.entries(ar).forEach(([k, v]) => res.push([k, ...v]));
  const ws = XLSX.utils.aoa_to_sheet(res, { cellDates: true }); ws['!cols'] = [{ wch: 34 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Resumen');
  wb.SheetNames.unshift(wb.SheetNames.pop()); // Resumen primero
  XLSX.writeFile(wb, `Afectaciones_EDS_AvBoyaca_${filtros.desde}_a_${filtros.hasta}.xlsx`, { cellDates: true });
  toast('Excel descargado ✓');
}
function addSheet(wb, aoa, nombre, anchos) {
  const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true });
  ws['!cols'] = anchos.map(w => ({ wch: w })); ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(1, aoa.length - 1), c: aoa[0].length - 1 } }) };
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let R = 1; R <= range.e.r; R++) for (let C = 0; C <= range.e.c; C++) { const cell = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (cell && cell.v instanceof Date) cell.z = aoa[0][C].toLowerCase().includes('inicio') || aoa[0][C].toLowerCase().includes('fin') ? 'dd/mm/yyyy hh:mm' : 'dd/mm/yyyy'; }
  XLSX.utils.book_append_sheet(wb, ws, nombre);
}

/* ========== UTILIDADES ========== */
let toastT;
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }
function confirmar(txt) { return new Promise(res => { $('#mTxt').textContent = txt; $('#modal').classList.add('on'); $('#mYes').onclick = () => { $('#modal').classList.remove('on'); res(true); }; $('#mNo').onclick = () => { $('#modal').classList.remove('on'); res(false); }; }); }

if (sesion.nombre && sesion.pin && gasUrl()) { $('#login').classList.add('hidden'); entrar(); } else mostrarLogin();
